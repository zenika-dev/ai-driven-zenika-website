name: CI

# Runs on every pull request, and is reused by the CD workflow before a deploy.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint (ESLint and Prettier)
        run: npm run lint

      - name: Type-check (astro check)
        run: npm run check

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      # Playwright builds the site and serves the production build itself (playwright.config.ts).
      - name: End-to-end and accessibility tests
        run: npm run test:e2e

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
