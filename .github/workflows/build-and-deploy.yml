name: Deploy to Clever Cloud Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
      - run: sudo npm install --global clever-tools@^4.11.0
      - run: clever version
      - run: echo "Current branch is ${{ github.head_ref || github.ref_name }}"
      - run: echo "caim = ${{ env.CLEVER_APP_ID_MAIN }} , cs = ${{ secrets.CLEVER_SECRET }} and ct = ${{ secrets.CLEVER_TOKEN }}"
      - run: echo " ${{env.CLEVER_APP_ID_MAIN }} and caim = ${{ vars.CLEVER_APP_ID_MAIN }}"
      - run: clever link ${{env.CLEVER_APP_ID_MAIN }}