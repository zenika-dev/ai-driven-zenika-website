name: Deploy to Clever Cloud Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
      - run: sudo npm install --global clever-tools@^4.11.0
      - run: clever version
      - run: |
          if [ -z "$CLEVER_TOKEN" ] || [ -z "$CLEVER_SECRET" ]; then
            echo "ERROR: CLEVER_TOKEN and/or CLEVER_SECRET are empty."
            echo "aborting..."
            echo "See CLEVER_AUTH.md"
            exit 1
          fi

          if ! PROFILE=$(clever profile --format json 2>&1); then
            echo "ERROR: Clever Cloud rejected the CI credentials."
            echo "CLEVER_TOKEN/CLEVER_SECRET are set but the API returned an auth error"
            echo "(most often: the token has passed its 1-year expiry, or was revoked)."
            echo "Rotate the credentials -- see .CLEVER_AUTH.md"
            echo "--- clever output ---"
            echo "${PROFILE}"
            exit 1
          fi

          echo "$PROFILE" | jq -r '"Authenticated as \(.email) (profile: \(.alias))"'

          EXPIRY=$(echo "${PROFILE}" | jq -r '.tokenExpiration')
          DAYS_LEFT=$(( ( $(date -d "${EXPIRY}" +%s) - $(date +%s) ) / 86400 ))
          echo "Token expires on ${EXPIRY} (${DAYS_LEFT} days remaining)"

          if [ "${DAYS_LEFT}" -lt 30 ]; then
            echo ""
            echo "WARNING: the Clever Cloud CI token expires in ${DAYS_LEFT} days."
            echo "Rotate it now to avoid a broken deploy pipeline."
            echo "See .circleci/CLEVER_AUTH.md"
          fi

